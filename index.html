<!DOCTYPE html>
<html lang="es">
<head>

<meta name="theme-color" content="#000000">
<meta name="google-site-verification" content="x01nFH4KHh-T-0Ib5TtVy9dsbSrzaLmss8EIcF4keSw" />
<meta property="og:type" content="website">
<meta property="og:site_name" content="DAZMOND & Co.">
<meta property="og:title" content="DAZMOND & Co. — American Luxury House">
<meta property="og:description" content="Prendas únicas, ediciones irrepetibles y envíos a todo el mundo. One-of-a-kind pieces, shipped worldwide.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000'/%3E%3Ctext x='50' y='70' font-size='64' text-anchor='middle' fill='%23C5A059' font-family='serif'%3ED%3C/text%3E%3C/svg%3E">
</head>
<body>

<!-- Barra superior: idioma y divisa -->
<div class="topbar">
  <div class="topbar-msg" id="topMsg"></div>
  <div class="topbar-switches">
    <button class="switch" id="langBtn" aria-label="Idioma / Language">ES | EN</button>
    <button class="switch" id="curBtn" aria-label="Divisa / Currency">USD $</button>
  </div>
</div>

<!-- Cabecera fija -->
<header class="header">
  <div class="header-left">
    <button class="icon-btn" id="searchBtn" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button class="icon-btn" id="menuBtn" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h16"/></svg></button>
  </div>
  <a href="#/" class="logo" aria-label="DAZMOND & Co.">Dazmond <span>&amp;</span> Co.</a>
  <div class="header-right">
    <a href="#/cuenta" class="icon-btn" aria-label="Mi cuenta / Favoritos"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span class="count" id="favCount"></span></a>
    <button class="icon-btn" id="cartBtn" aria-label="Carrito"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg><span class="count" id="cartCount"></span></button>
  </div>
</header>

<!-- Menú principal -->
<nav class="mainnav" id="mainNav" aria-label="Menú principal"></nav>
<div class="megamenu" id="megaMenu" hidden></div>

<!-- Contenido (se cambia sin recargar la página) -->
<main id="app" tabindex="-1"></main>

<!-- Suscripción -->
<section class="subscribe" id="subscribe">
  <p class="eyebrow" data-i18n="sub_eyebrow"></p>
  <h2 data-i18n="sub_title"></h2>
  <p class="muted" data-i18n="sub_text"></p>
  <form id="subForm" class="sub-form">
    <input type="email" name="EMAIL" required autocomplete="email" data-i18n-ph="sub_ph">
    <button type="submit" class="btn" data-i18n="sub_btn"></button>
  </form>
  <p class="sub-msg" id="subMsg" role="status"></p>
  <iframe name="subFrame" id="subFrame" hidden title="subscribe"></iframe>
</section>

<!-- Pie oficial -->
<footer class="footer">
  <div class="footer-logo">Dazmond <span>&amp;</span> Co.</div>
  <nav class="social" id="social" aria-label="Redes sociales"></nav>
  <div class="footer-cols">
    <div>
      <h4 data-i18n="f_house"></h4>
      <a href="#/identidad" data-i18n="f_identity"></a>
      <a href="#/identidad#campanas" data-i18n="f_campaigns"></a>
      <a href="#/c/decor" data-i18n="f_decor"></a>
    </div>
    <div>
      <h4 data-i18n="f_help"></h4>
      <a href="policies/shipping/" data-i18n="l_envios"></a>
      <a href="policies/returns/" data-i18n="l_devoluciones"></a>
      <a href="contact/">Contact · Contacto</a>
      <a href="#/cuenta" data-i18n="f_account"></a>
    </div>
    <div>
      <h4 data-i18n="f_legal"></h4>
      <a href="#/legal/aviso" data-i18n="l_aviso"></a>
      <a href="policies/privacy/" data-i18n="l_privacidad"></a>
      <a href="policies/terms/" data-i18n="l_terminos"></a>
      <a href="#/legal/cookies" data-i18n="l_cookies"></a>
    </div>
  </div>
  <p class="secure" data-i18n="secure"></p>
  <div class="payments" aria-label="Métodos de pago">
    <span title="Visa" aria-label="Visa"><svg viewBox="0 0 50 32" role="img"><rect width="50" height="32" rx="4" fill="#fff"/><text x="25" y="21" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" font-style="italic" fill="#1A1F71">VISA</text></svg></span><span title="Mastercard" aria-label="Mastercard"><svg viewBox="0 0 50 32" role="img"><rect width="50" height="32" rx="4" fill="#fff"/><circle cx="20" cy="16" r="9" fill="#EB001B"/><circle cx="30" cy="16" r="9" fill="#F79E1B"/><path d="M25 8.5a9 9 0 010 15 9 9 0 010-15z" fill="#FF5F00"/></svg></span><span title="American Express" aria-label="American Express"><svg viewBox="0 0 50 32" role="img"><rect width="50" height="32" rx="4" fill="#2E77BC"/><text x="25" y="20" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#fff">AMEX</text></svg></span><span title="Apple Pay" aria-label="Apple Pay"><svg viewBox="0 0 50 32" role="img"><rect width="50" height="32" rx="4" fill="#fff"/><text x="25" y="20" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" fill="#000">Apple Pay</text></svg></span><span title="Google Pay" aria-label="Google Pay"><svg viewBox="0 0 50 32" role="img"><rect width="50" height="32" rx="4" fill="#fff"/><text x="25" y="20" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700"><tspan fill="#4285F4">G</tspan><tspan fill="#5F6368"> Pay</tspan></text></svg></span><span title="Amazon Pay" aria-label="Amazon Pay"><svg viewBox="0 0 50 32" role="img"><rect width="50" height="32" rx="4" fill="#fff"/><text x="25" y="17" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" fill="#232F3E">amazon</text><path d="M14 21q11 5 22 0" stroke="#FF9900" stroke-width="1.8" fill="none"/><text x="25" y="29" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="6" fill="#232F3E">pay</text></svg></span><span title="Klarna" aria-label="Klarna"><svg viewBox="0 0 50 32" role="img"><rect width="50" height="32" rx="4" fill="#FFB3C7"/><text x="25" y="20" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#17120F">Klarna.</text></svg></span><span title="Affirm" aria-label="Affirm"><svg viewBox="0 0 50 32" role="img"><rect width="50" height="32" rx="4" fill="#fff"/><text x="25" y="20" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#4A4AF4">affirm</text></svg></span><span title="Stripe" aria-label="Stripe"><svg viewBox="0 0 50 32" role="img"><rect width="50" height="32" rx="4" fill="#635BFF"/><text x="25" y="20" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#fff">stripe</text></svg></span>
  </div>
  <p class="copyright" id="copyright"></p>
</footer>

<!-- Buscador -->
<div class="overlay" id="searchOverlay" hidden>
  <div class="overlay-inner">
    <div class="search-row">
      <input type="search" id="searchInput" data-i18n-ph="search_ph" autocomplete="off">
      <button class="icon-btn" data-close="searchOverlay" aria-label="Cerrar">✕</button>
    </div>
    <div class="grid" id="searchResults"></div>
  </div>
</div>

<!-- Carrito -->
<aside class="drawer" id="cartDrawer" hidden>
  <div class="drawer-head">
    <h3 data-i18n="cart"></h3>
    <button class="icon-btn" data-close="cartDrawer" aria-label="Cerrar">✕</button>
  </div>
  <div id="cartItems" class="drawer-body"></div>
  <div class="drawer-foot" id="cartFoot"></div>
</aside>
<div class="backdrop" id="backdrop" hidden></div>

<!-- Visor de zoom -->
<div class="lightbox" id="lightbox" hidden><button class="close" id="lbClose" aria-label="Cerrar">✕</button><img id="lbImg" alt=""></div>

<script src="assets/app.js" defer></script>
</body>
</html>
